# =============================================================
# ComplaintIQ - central configuration
# Every script reads settings from here. Change values here,
# never hard-code them inside Python files.
# =============================================================

project:
  name: complaintiq
  seed: 42              # one seed for every random step -> reproducible results

# All paths are relative to the project root folder.
paths:
  raw: data/raw              # downloaded zip files (never edited)
  interim: data/interim      # narratives extracted to Parquet
  processed: data/processed  # cleaned, split, model-ready data
  sample: data/sample        # small sample committed to GitHub
  gold: data/gold            # hand-labelled evaluation sets
  models: models             # trained model artifacts
  reports: reports           # metrics JSON + figures
  logs: logs                 # log files

data:
  base_url: "https://files.consumerfinance.gov/f/documents/"
  # Training window: April 2024 - June 2025
  train_files:
    - CCDB_Export_6_April_2024_through_July_2024.zip
    - CCDB_Export_7_August_2024_through_October_2024.zip
    - CCDB_Export_8_November_2024_through_December_2024.zip
    - CCDB_Export_9_January_2025_through_February_2025.zip
    - CCDB_Export_10_March_2025_through_April_2025.zip
    - CCDB_Export_11_May_2025_through_June_2025.zip
  # Held-out future data to measure model drift
  drift_files:
    - CCDB_Export_16_March_2026.zip
  text_column: "Consumer complaint narrative"
  label_column: "Product"
  # Raw CSV column -> clean name used everywhere after ingest.
  # Only these columns are kept. Change the LEFT side if CFPB renames a column;
  # keep the RIGHT side unchanged (the code relies on these names).
  columns:
    "Complaint ID": complaint_id
    "Date received": date_received
    "Product": product
    "Sub-product": sub_product
    "Issue": issue
    "Sub-issue": sub_issue
    "Consumer complaint narrative": narrative
    "Company": company
    "State": state
    "Submitted via": submitted_via
    "Company response to consumer": company_response
    "Timely response?": timely_response

cleaning:
  min_chars: 50             # shorter narratives carry almost no signal
  max_per_product: 10000    # cap per class for the modelling set
  sample_per_product: 45    # rows per class in the small CSV committed to Git
  near_dup:
    num_perm: 64            # MinHash signature length
    bands: 16               # LSH bands (num_perm must be divisible by bands)
    shingle_words: 3        # word 3-grams
    threshold: 0.7          # estimated Jaccard similarity to count as near-duplicate